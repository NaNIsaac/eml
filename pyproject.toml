[project]
name = "eml"
version = "0.1.0"
description = "REPL that builds arithmetic from the single operator exp(x) - ln(y) by macro expansion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
eml = "eml:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
